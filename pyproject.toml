[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-post-process"
version = "0.1.0"
description = "Validate Altium Designer BOMs, generate assembly values, and export standard Word BOMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
bom-post-process = "bom_post_process.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bom_post_process = ["resources/*.docx", "resources/*.ps1", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
